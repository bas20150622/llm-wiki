[project]
name = "llm-wiki"
version = "0.2.0"
description = "Engine for strictly separated LLM-maintained wikis: shared schema plus the llm-wiki CLI"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.134",
    "pyyaml>=6",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real Docling conversion"]
